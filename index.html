<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map Indonesia</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside id="sidebar">
    <h2>Find Route</h2>
    <div class="form-group">
        <label>From</label>
        <input type="text" id="from-input" placeholder="Pinpoint name" autocomplete="off">
    </div>
    <div class="form-group">
        <label>To</label>
        <input type="text" id="to-input" placeholder="Pinpoint name" autocomplete="off">
    </div>
    <div class="sort-group">
        <span>Sort by</span>
        <button id="sort-fastest" class="sort-btn active">Fastest</button>
        <button id="sort-cheapest" class="sort-btn">Cheapest</button>
    </div>
    <button id="search-btn" disabled>Search</button>
    <div id="route-results"></div>
</aside>

<main id="viewport">
    <div id="map-transform">
        <div id="map-layer"></div>
        <svg id="connections-layer" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="pins-layer"></div>
        <div id="popups-layer"></div>
    </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
